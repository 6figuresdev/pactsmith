[package]
name = "pactsmith-split"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5"

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }

near-workspaces = "0.24"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
