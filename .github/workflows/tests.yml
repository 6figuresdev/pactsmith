   name: tests
   on:
     push:
       branches: [main]
     pull_request:
   permissions:
     contents: read
   jobs:
     backend:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - uses: actions/setup-node@v4
           with:
             node-version: 22
         - run: node --test
           working-directory: server
     contracts:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - run: rustup update stable
         - run: cargo test --lib --workspace
